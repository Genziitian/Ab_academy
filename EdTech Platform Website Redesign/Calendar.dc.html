<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#0f1b2d;background:#f7f8fc;-webkit-font-smoothing:antialiased}a{color:#2962ff;text-decoration:none}a:hover{color:#1a4de0}</style></helmet>
<div style="display:flex;min-height:100vh;font-family:'IBM Plex Sans',sans-serif">
  <dc-import name="PortalSidebar" active="calendar" hint-size="248px,100vh"></dc-import>
  <div style="flex:1;min-width:0">
    <dc-import name="PortalTopbar" title="Calendar" crumb="Student portal" hint-size="100%,68px"></dc-import>
    <div style="padding:28px 32px 48px;max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start">
      <section style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;padding:24px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2 style="margin:0;font-size:20px;font-weight:600;color:#122046">September 2026</h2>
          <div style="display:flex;align-items:center;gap:16px">
            <div style="display:flex;gap:14px;font-size:12px;color:#4a5872"><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#e5484d"></span>Live</span><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#2962ff"></span>Recorded</span><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#ff8a3d"></span>Test</span></div>
            <div style="display:flex;gap:4px"><button style="width:34px;height:34px;border:1px solid #e6ebf5;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;color:#122046">‹</button><button style="width:34px;height:34px;border:1px solid #e6ebf5;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;color:#122046">›</button></div>
          </div>
        </div>
        <div style="margin-top:20px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#e6ebf5;border:1px solid #e6ebf5;border-radius:10px;overflow:hidden">
          <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7"><div style="background:#f7f8fc;padding:10px;font-size:12px;font-weight:600;color:#6b7a90;text-align:center">{{ d }}</div></sc-for>
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
            <button onClick="{{ d.pick }}" style="{{ d.style }}"><span style="{{ d.numStyle }}">{{ d.n }}</span><span style="{{ d.dot }}"></span></button>
          </sc-for>
        </div>
      </section>
      <aside style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;padding:24px">
        <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.06em;color:#6b7a90">AGENDA</p>
        <h3 style="margin:4px 0 0;font-size:18px;font-weight:600;color:#122046">{{ selLabel }}</h3>
        <div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ agenda }}" as="a" hint-placeholder-count="3">
            <div style="{{ a.card }}">
              <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600;color:#122046">{{ a.time }}</span><span style="{{ a.tag }}">{{ a.kind }}</span></div>
              <p style="margin:8px 0 0;font-size:15px;font-weight:600;color:#122046">{{ a.title }}</p>
              <p style="margin:2px 0 0;font-size:13px;color:#6b7a90">{{ a.sub }}</p>
              <sc-if value="{{ a.joinable }}" hint-placeholder-val="{{ false }}"><a href="Live Classroom.dc.html" style="margin-top:12px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#2962ff;color:#fff;font-size:14px;font-weight:600">Join now</a></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ noAgenda }}" hint-placeholder-val="{{ false }}"><p style="margin:0;padding:24px;text-align:center;border:1px dashed #d5dcea;border-radius:10px;font-size:14px;color:#6b7a90">No classes scheduled.</p></sc-if>
        </div>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MARKS = { 14: 'live', 16: 'recorded', 18: 'test', 21: 'recorded', 24: 'live', 28: 'recorded' };
const DOT = { live: '#e5484d', recorded: '#2962ff', test: '#ff8a3d' };
const AG = [
  { time: '6:00 PM', title: 'Mathematics', sub: 'Quadratic Equations · Amit Sir', kind: 'live', joinable: true },
  { time: '7:30 PM', title: 'Science', sub: "Carbon & Compounds · Neha Ma'am", kind: 'live' },
  { time: '8:30 PM', title: 'Physics Test', sub: '15 questions · 30 min', kind: 'test' },
];
class Component extends DCLogic {
  state = { sel: 14 };
  renderVals() {
    const sel = this.state.sel;
    const days = [];
    for (let i = 0; i < 35; i++) {
      const n = i - 1; // Sept 2026 starts Tuesday (Mon-first grid)
      const valid = n >= 1 && n <= 30, on = valid && n === sel, k = MARKS[n];
      days.push({ n: valid ? n : '', pick: () => valid && this.setState({ sel: n }),
        style: { background: on ? '#e8f0ff' : '#fff', border: 0, height: 84, padding: 10, display: 'flex', flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'space-between', cursor: valid ? 'pointer' : 'default', font: 'inherit' },
        numStyle: { fontSize: 14, fontWeight: on ? 700 : 500, color: on ? '#2962ff' : '#122046' },
        dot: { width: 8, height: 8, borderRadius: '50%', background: k ? DOT[k] : 'transparent' } });
    }
    const agenda = sel === 14 ? AG : MARKS[sel] ? [{ time: '5:00 PM', title: MARKS[sel] === 'test' ? 'Weekly Test' : 'Mathematics', sub: MARKS[sel] === 'recorded' ? 'Recorded · 45 min' : 'Amit Sir', kind: MARKS[sel] }] : [];
    const tagC = { live: ['#fde8e8', '#c43b3b'], recorded: ['#e8f0ff', '#2962ff'], test: ['#fff1e8', '#c06a1a'] };
    return {
      dows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], days,
      selLabel: `${sel} September 2026`, noAgenda: agenda.length === 0,
      agenda: agenda.map(a => ({ ...a, joinable: !!a.joinable,
        card: { padding: 16, borderRadius: 10, border: a.joinable ? '1px solid #c9d6f5' : '1px solid #e6ebf5', background: a.joinable ? '#f5f8ff' : '#fff' },
        tag: { padding: '2px 8px', whiteSpace: 'nowrap', borderRadius: 4, fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em', background: tagC[a.kind][0], color: tagC[a.kind][1] } })),
    };
  }
}
</script>
</body>
</html>
