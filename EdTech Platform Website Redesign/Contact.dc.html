<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#0f1b2d;background:#f7f8fc;-webkit-font-smoothing:antialiased}a{color:#2962ff;text-decoration:none}a:hover{color:#1a4de0}</style></helmet>
<dc-import name="SiteHeader" active="" hint-size="100%,68px"></dc-import>
<main style="font-family:'IBM Plex Sans',sans-serif">
  <section style="max-width:1200px;margin:0 auto;padding:72px 24px 88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px">
    <div>
      <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#2962ff">Contact</p>
      <h1 style="margin:12px 0 0;font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-0.025em;color:#122046">We're here to help</h1>
      <p style="margin:16px 0 0;font-size:17px;line-height:1.6;color:#4a5872;max-width:460px">Questions about courses, payments or live classes? Reach the support team.</p>
      <div style="margin-top:36px;background:#fff;border:1px solid #e6ebf5;border-radius:12px">
        <div style="padding:18px 22px;display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e6ebf5"><span style="font-size:14px;color:#6b7a90">Email</span><span style="font-size:15px;font-weight:600;color:#122046">support@akhandbharatacademy.in</span></div>
        <div style="padding:18px 22px;display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e6ebf5"><span style="font-size:14px;color:#6b7a90">WhatsApp</span><span style="font-size:15px;font-weight:600;color:#122046">+91 90000 00000 (placeholder)</span></div>
        <div style="padding:18px 22px;display:flex;justify-content:space-between;gap:16px"><span style="font-size:14px;color:#6b7a90">Hours</span><span style="font-size:15px;font-weight:600;color:#122046">Mon–Sat, 9:00 AM – 7:00 PM IST</span></div>
      </div>
      <p style="margin:20px 0 0;font-size:14px;color:#6b7a90">Already enrolled? <a href="Support Tickets.dc.html" style="font-weight:600">Raise a support ticket</a> from your portal.</p>
    </div>
    <form style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;padding:32px;box-shadow:0 14px 40px rgba(18,32,70,0.06);display:flex;flex-direction:column;gap:18px">
      <h2 style="margin:0;font-size:20px;font-weight:600;color:#122046">Send us a message</h2>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Full name<input placeholder="Rahul Kumar" style="height:44px;padding:0 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;outline:none" style-focus="border-color:#2962ff"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Mobile number<input placeholder="98765 43210" style="height:44px;padding:0 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;outline:none" style-focus="border-color:#2962ff"></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Topic<select style="height:44px;padding:0 10px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;background:#fff"><option>Course &amp; batch selection</option><option>Payment</option><option>Live classes</option><option>Refund / Grievance</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Message<textarea rows="4" placeholder="How can we help?" style="padding:10px 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;outline:none;resize:vertical" style-focus="border-color:#2962ff"></textarea></label>
      <button type="button" style="height:48px;border:0;border-radius:8px;background:#2962ff;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer" style-hover="background:#1a4de0">Send message</button>
    </form>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</x-dc>
</body>
</html>
