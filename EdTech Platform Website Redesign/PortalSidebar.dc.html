<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;courses&quot;,&quot;live&quot;,&quot;calendar&quot;,&quot;materials&quot;,&quot;downloads&quot;,&quot;notifications&quot;,&quot;tickets&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const base = { display: 'flex', alignItems: 'center', gap: 12, height: 40, padding: '0 10px', borderRadius: 8, fontSize: 14, fontWeight: 500, color: '#4a5872' };
    const on = { ...base, background: '#e8f0ff', color: '#2962ff', fontWeight: 600 };
    const st = {};
    ['dashboard','courses','live','calendar','materials','downloads','notifications','tickets','profile'].forEach(k => st[k] = a === k ? on : base);
    return { st };
  }
}
