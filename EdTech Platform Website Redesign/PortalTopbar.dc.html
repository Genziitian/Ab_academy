<body>
<x-dc>

    <h1 style="margin:2px 0 0;font-size:18px;font-weight:600;color:#122046;letter-spacing:-0.01em">{{ title }}</h1>
  </div>
  <div style="display:flex;align-items:center;gap:8px;height:38px;width:220px;flex-shrink:1;min-width:120px;padding:0 12px;border:1px solid #e6ebf5;border-radius:8px;background:#f7f8fc;color:#6b7a90"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"></circle><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg><input placeholder="Search lessons, notes, chapters" style="border:0;background:transparent;outline:none;font:inherit;font-size:14px;flex:1;color:#0f1b2d"></div>
  <a href="Notifications.dc.html" style="position:relative;width:38px;height:38px;border:1px solid #e6ebf5;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#122046"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#ff5d8f;border:1.5px solid #fff"></span></a>
  <a href="Profile.dc.html" style="display:flex;align-items:center;gap:10px;padding-left:8px">
    <span style="width:36px;height:36px;border-radius:50%;background:#e8f0ff;color:#2962ff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">RK</span>
    <span style="display:flex;flex-direction:column;line-height:1.25;white-space:nowrap"><span style="font-size:14px;font-weight:600;color:#122046">Rahul Kumar</span><span style="font-size:12px;color:#6b7a90">Class 10 · Bihar Board</span></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:70},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Student portal&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
