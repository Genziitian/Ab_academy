  <div style="max-width:1200px;margin:0 auto;height:68px;padding:0 24px;display:flex;align-items:center;gap:20px">

    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;courses&quot;,&quot;notes&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const base = { padding: '8px 10px', whiteSpace: 'nowrap', borderRadius: 6, fontSize: 14, fontWeight: 500, color: '#4a5872' };
    const on = { ...base, color: '#2962ff', background: '#e8f0ff', fontWeight: 600 };
    const st = {};
    ['courses', 'notes'].forEach(k => st[k] = a === k ? on : base);
    return { st };
  }
}
</script>
