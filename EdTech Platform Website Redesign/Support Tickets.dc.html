<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"><style>body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:#0f1b2d;background:#f7f8fc;-webkit-font-smoothing:antialiased}a{color:#2962ff;text-decoration:none}a:hover{color:#1a4de0}</style></helmet>
<div style="display:flex;min-height:100vh;font-family:'IBM Plex Sans',sans-serif">
  <dc-import name="PortalSidebar" active="tickets" hint-size="248px,100vh"></dc-import>
  <div style="flex:1;min-width:0">
    <dc-import name="PortalTopbar" title="Help &amp; Support" crumb="Student portal" hint-size="100%,68px"></dc-import>
    <div style="padding:28px 32px 48px;max-width:1280px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:12px">
        <button onClick="{{ newTicket }}" style="height:44px;border:0;border-radius:8px;background:#2962ff;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer">+ New ticket</button>
        <div style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;overflow:hidden">
          <sc-for list="{{ tickets }}" as="t" hint-placeholder-count="2">
            <button onClick="{{ t.pick }}" style="{{ t.row }}">
              <span style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b7a90">{{ t.reference }}</span><span style="{{ t.badge }}">{{ t.statusLabel }}</span></span>
              <span style="display:block;margin-top:6px;font-size:14px;font-weight:600;color:#122046">{{ t.subject }}</span>
              <span style="display:block;margin-top:4px;font-size:12px;color:#6b7a90">{{ t.category }} · {{ t.opened }}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{ composing }}" hint-placeholder-val="{{ false }}">
        <section style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px">
          <h2 style="margin:0;font-size:20px;font-weight:600;color:#122046">Raise a new ticket</h2>
          <div><p style="margin:0 0 8px;font-size:14px;font-weight:500;color:#122046">Category</p><div style="display:flex;gap:8px"><sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.name }}</button></sc-for></div></div>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Subject<input placeholder="Briefly describe the issue" style="height:44px;padding:0 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;outline:none"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#122046">Details<textarea rows="5" placeholder="Include order ID, course name or screenshots where helpful" style="padding:10px 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:15px;resize:vertical"></textarea></label>
          <div style="display:flex;gap:10px"><button onClick="{{ cancel }}" style="height:44px;padding:0 18px;border:1px solid #e6ebf5;border-radius:8px;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#122046;cursor:pointer">Cancel</button><button onClick="{{ cancel }}" style="height:44px;padding:0 18px;border:0;border-radius:8px;background:#2962ff;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer">Submit ticket</button></div>
        </section>
      </sc-if>
      <sc-if value="{{ viewing }}" hint-placeholder-val="{{ true }}">
        <section style="background:#fff;border:1px solid #e6ebf5;border-radius:12px;overflow:hidden">
          <div style="padding:20px 24px;border-bottom:1px solid #e6ebf5"><div style="display:flex;align-items:center;gap:10px"><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b7a90">{{ sel.reference }}</span><span style="{{ sel.badge }}">{{ sel.statusLabel }}</span></div><h2 style="margin:6px 0 0;font-size:20px;font-weight:600;color:#122046">{{ sel.subject }}</h2></div>
          <div style="padding:24px;display:flex;flex-direction:column;gap:16px">
            <sc-for list="{{ sel.messages }}" as="m" hint-placeholder-count="2">
              <div style="{{ m.wrap }}"><div style="{{ m.bubble }}"><p style="margin:0;font-size:12px;font-weight:600;color:{{ m.authorColor }}">{{ m.author }} · {{ m.time }}</p><p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#122046">{{ m.body }}</p></div></div>
            </sc-for>
          </div>
          <div style="padding:16px 24px;border-top:1px solid #e6ebf5;display:flex;gap:10px"><input placeholder="Write a reply…" style="flex:1;height:44px;padding:0 12px;border:1px solid #dde0e8;border-radius:8px;font:inherit;font-size:14px;outline:none"><button style="height:44px;padding:0 18px;border:0;border-radius:8px;background:#2962ff;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer">Reply</button></div>
        </section>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = [
  { reference: 'ABA-T-1042', subject: 'Payment deducted but course not unlocked', category: 'Payment', status: 'progress', opened: 'Opened 2 days ago', messages: [
    { body: 'I paid ₹2,999 by UPI yesterday but the Class 10 batch still shows as locked. The amount has left my account.', time: '2 days ago' },
    { body: 'Thanks for writing in Rahul. We can see the payment and are reconciling it with the bank. Your access will be unlocked within 24 hours.', time: '1 day ago', support: 'Support · Kavita' }] },
  { reference: 'ABA-T-1017', subject: 'Video keeps buffering on mobile data', category: 'Technical', status: 'resolved', opened: 'Opened 1 week ago', messages: [
    { body: 'Lectures buffer constantly on 4G but work on wifi.', time: '1 week ago' },
    { body: 'Set Video Quality to 480p under Profile → Learning for mobile data, and download lessons overnight on wifi. Closing this — reopen if it persists.', time: '5 days ago', support: 'Support · Manish' }] },
];
class Component extends DCLogic {
  state = { sel: 0, mode: 'view', cat: 'Payment' };
  renderVals() {
    const s = this.state;
    const badge = st => ({ padding: '2px 8px', whiteSpace: 'nowrap', borderRadius: 4, fontSize: 11, fontWeight: 700, letterSpacing: '0.03em', background: st === 'resolved' ? '#e9f9ef' : '#fff1e8', color: st === 'resolved' ? '#16a34a' : '#c06a1a' });
    const map = (t, i) => ({ ...t, badge: badge(t.status), statusLabel: t.status === 'resolved' ? 'RESOLVED' : 'IN PROGRESS',
      pick: () => this.setState({ sel: i, mode: 'view' }),
      row: { width: '100%', display: 'block', textAlign: 'left', padding: '16px 18px', border: 0, borderBottom: '1px solid #eff1f5', font: 'inherit', cursor: 'pointer', background: s.mode === 'view' && s.sel === i ? '#f5f8ff' : '#fff', borderLeft: s.mode === 'view' && s.sel === i ? '3px solid #2962ff' : '3px solid transparent' },
      messages: t.messages.map(m => ({ ...m, author: m.support || 'You', authorColor: m.support ? '#2962ff' : '#6b7a90',
        wrap: { display: 'flex', justifyContent: m.support ? 'flex-start' : 'flex-end' },
        bubble: { maxWidth: '75%', padding: '12px 16px', borderRadius: 10, background: m.support ? '#f5f8ff' : '#fff', border: m.support ? '1px solid #dbe6ff' : '1px solid #e6ebf5' } })) });
    const tickets = T.map(map);
    return {
      tickets, sel: tickets[s.sel], composing: s.mode === 'new', viewing: s.mode === 'view',
      newTicket: () => this.setState({ mode: 'new' }), cancel: () => this.setState({ mode: 'view' }),
      cats: ['Payment', 'Technical', 'Course content', 'Other'].map(n => ({ name: n, pick: () => this.setState({ cat: n }),
        style: { height: 34, padding: '0 14px', borderRadius: 8, whiteSpace: 'nowrap', font: 'inherit', fontSize: 13, fontWeight: 500, cursor: 'pointer', border: s.cat === n ? '1px solid #2962ff' : '1px solid #e6ebf5', background: s.cat === n ? '#e8f0ff' : '#fff', color: s.cat === n ? '#2962ff' : '#4a5872' } })),
    };
  }
}
</script>
</body>
</html>
