<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;background:#FFFFFF;border-top:1px solid #ECEEF3;padding:10px 12px 22px;display:grid;grid-template-columns:repeat(5,1fr);font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="{{ sHome }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.1px">Home</span>
  </div>
  <div style="{{ sCourses }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.1px">Courses</span>
  </div>
  <div style="{{ sCalendar }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.1px">Calendar</span>
  </div>
  <div style="{{ sDownloads }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.1px">Downloads</span>
  </div>
  <div style="{{ sProfile }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.1px">Profile</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:78},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;courses&quot;,&quot;calendar&quot;,&quot;downloads&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  tab(on) {
    return {
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '5px',
      padding: '8px 0 7px', borderRadius: '14px', cursor: 'pointer',
      color: on ? '#3A3F99' : '#9AA0AE',
      background: on ? '#EEEFFA' : 'transparent',
      transition: 'background .18s ease, color .18s ease'
    };
  }
  renderVals() {
    const a = this.props.active || 'home';
    return {
      sHome: this.tab(a === 'home'), sCourses: this.tab(a === 'courses'),
      sCalendar: this.tab(a === 'calendar'), sDownloads: this.tab(a === 'downloads'),
      sProfile: this.tab(a === 'profile')
    };
  }
}
</script>
</body>
</html>
