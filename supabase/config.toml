# Supabase local defaults (override when linking a remote project)
project_id = "akhand-bharat-academy"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
]

[auth.sms]
enable_signup = true
enable_confirmations = false

# Google OAuth for `supabase start`. The hosted project is configured in the
# dashboard instead (Authentication → Providers → Google); these env vars are
# only read for the local stack, so keep them in your shell, not in git.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Blank means "use Supabase's own callback" — the GCP console still needs the
# http://127.0.0.1:54321/auth/v1/callback redirect URI added for local sign-in.
redirect_uri = ""
skip_nonce_check = false

# The Razorpay webhook carries no user JWT; `checkout` verifies callers itself.
[functions.checkout]
verify_jwt = false
